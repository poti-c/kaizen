<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Na Nirand Kaizen System</title>
    <script>
      // GitHub Pages SPA routing fix — redirect to index with path encoded as query param
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
