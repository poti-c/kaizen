<svg width="760" height="220" viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Na Nirand Kaizen System horizontal logo</title>
  <desc>A professional horizontal logo retaining the original hourglass and continuous-improvement symbol.</desc>
  <defs>
    <linearGradient id="goldStroke" x1="35" y1="28" x2="161" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0C286"/>
      <stop offset="0.5" stop-color="#B9864B"/>
      <stop offset="1" stop-color="#6F4B33"/>
    </linearGradient>
    <linearGradient id="navyPanel" x1="0" y1="0" x2="760" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172A3A"/>
      <stop offset="1" stop-color="#0E1C28"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#07101A" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="760" height="220" rx="28" fill="url(#navyPanel)"/>

  <g filter="url(#softShadow)">
    <rect x="48" y="36" width="148" height="148" rx="40" fill="#F8F4EC"/>
    <rect x="52.5" y="40.5" width="139" height="139" rx="35.5" stroke="#E7D9C2" stroke-opacity="0.72"/>
  </g>

  <g transform="translate(122 110)">
    <circle r="6.4" fill="#193247"/>
    <path d="M-36 -54C-18 -46 -7 -31 -4 -14C-2 -3 -8 3 -20 8C-32 13 -43 25 -45 42"
          stroke="url(#goldStroke)" stroke-width="8.2" stroke-linecap="round"/>
    <path d="M36 -54C18 -46 7 -31 4 -14C2 -3 8 3 20 8C32 13 43 25 45 42"
          stroke="url(#goldStroke)" stroke-width="8.2" stroke-linecap="round"/>
    <path d="M-36 54C-18 46 -7 31 -4 14C-2 3 -8 -3 -20 -8C-32 -13 -43 -25 -45 -42"
          stroke="url(#goldStroke)" stroke-width="8.2" stroke-linecap="round"/>
    <path d="M36 54C18 46 7 31 4 14C2 3 8 -3 20 -8C32 -13 43 -25 45 -42"
          stroke="url(#goldStroke)" stroke-width="8.2" stroke-linecap="round"/>
    <path d="M-31 -60H31" stroke="#31465A" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M-31 60H31" stroke="#31465A" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="-16" cy="-22" r="3.2" fill="#C89C5D"/>
    <circle cx="15" cy="23" r="3.2" fill="#C89C5D"/>
  </g>

  <g transform="translate(235 68)">
    <text x="0" y="42"
          font-family="Avenir Next, Inter, Montserrat, Arial, sans-serif"
          font-size="42"
          font-weight="700"
          letter-spacing="0.2"
          fill="#E2BE7E">Na Nirand</text>
    <text x="2" y="82"
          font-family="Avenir Next, Inter, Montserrat, Arial, sans-serif"
          font-size="25"
          font-weight="520"
          letter-spacing="0.9"
          fill="#F6F4EF">Kaizen System</text>
    <path d="M2 104H230" stroke="#D2A767" stroke-width="2" stroke-linecap="round" opacity="0.82"/>
    <path d="M250 104H292" stroke="#F6F4EF" stroke-width="2" stroke-linecap="round" opacity="0.32"/>
  </g>
