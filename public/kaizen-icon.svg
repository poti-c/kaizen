<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c2b3a"/>
      <stop offset="1" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="8" y1="4" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2C886"/>
      <stop offset="0.48" stop-color="#C49040"/>
      <stop offset="1" stop-color="#7A4E2D"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="40" height="40" rx="10" fill="url(#iconBg)"/>

  <!-- Na Nirand figure-8 symbol, extracted from horizontal logo, scaled to icon -->
  <g transform="translate(20 20) scale(0.255)">

    <!-- Four calligraphic arms forming the hourglass / figure-8 -->
    <path d="M-36 -54C-18 -46 -7 -31 -4 -14C-2 -3 -8 3 -20 8C-32 13 -43 25 -45 42"
          stroke="url(#iconGold)" stroke-width="9.5" stroke-linecap="round" fill="none"/>
    <path d="M36 -54C18 -46 7 -31 4 -14C2 -3 8 3 20 8C32 13 43 25 45 42"
          stroke="url(#iconGold)" stroke-width="9.5" stroke-linecap="round" fill="none"/>
    <path d="M-36 54C-18 46 -7 31 -4 14C-2 3 -8 -3 -20 -8C-32 -13 -43 -25 -45 -42"
          stroke="url(#iconGold)" stroke-width="9.5" stroke-linecap="round" fill="none"/>
    <path d="M36 54C18 46 7 31 4 14C2 3 8 -3 20 -8C32 -13 43 -25 45 -42"
          stroke="url(#iconGold)" stroke-width="9.5" stroke-linecap="round" fill="none"/>

    <!-- Horizontal bars (top & bottom of hourglass) -->
    <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#2e4560" stroke-width="6" stroke-linecap="round"/>
    <line x1="-30" y1="60"  x2="30" y2="60"  stroke="#2e4560" stroke-width="6" stroke-linecap="round"/>

    <!-- Centre cover dot (hides the crossing point cleanly) -->
    <circle r="7" fill="url(#iconBg)"/>

    <!-- Small calligraphic accent dots -->
    <circle cx="-15" cy="-21" r="3.5" fill="#C89C5D"/>
    <circle cx="15"  cy="22"  r="3.5" fill="#C89C5D"/>

  </g>
</svg>
