[env:guition]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM -DU8G2_USE_LARGE_FONTS -Wl,--wrap=esp_lcd_new_rgb_panel
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    bblanchon/ArduinoJson@7.4.2
    ; Only for its font tables: with U8g2 present, Arduino_GFX enables UTF-8
    ; text and the Unifont (Thai) font used for non-ASCII labels.
    olikraus/U8g2@2.35.9
